                                                    onChange={(e) => updateUtmify(idx, 'scriptCode', e.target.value)}
                                                    placeholder="Cole o script ou código aqui..."
                                                    className="w-full px-3 py-2 rounded-xl border border-[#e2e9f0] dark:border-[#223247] bg-white dark:bg-[#0b131f] text-xs font-mono"
                                                />
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    {/* 2. Facebook */}
                    <div className="bg-white dark:bg-[#152132] rounded-[24px] p-6 border border-[#e2e9f0] dark:border-[#1e2d42] shadow-sm space-y-4">
                        <div className="flex items-center justify-between border-b border-[#e2e9f0] dark:border-[#1e2d42] pb-3">
                            <div className="flex items-center gap-2.5">
                                <div className="w-7 h-7 rounded-lg bg-blue-600 text-white font-black text-xs flex items-center justify-center">f</div>
                                <h3 className="text-sm font-extrabold text-[#132238] dark:text-white">Pixels Facebook / Meta Ads ({pixels.facebook.length})</h3>
                            </div>
                            <button
                                type="button"
                                onClick={addFacebook}
                                className="px-3 py-1.5 rounded-lg bg-blue-50 dark:bg-blue-950/40 text-blue-600 dark:text-blue-300 font-bold text-xs hover:bg-blue-100 transition flex items-center gap-1.5"
                            >
                                <Icon name="plus" className="w-3.5 h-3.5" />
                                Adicionar Pixel Facebook
                            </button>
                        </div>

                        {pixels.facebook.length === 0 ? (
                            <p className="text-xs text-[#718197] text-center py-4">Nenhum pixel do Facebook cadastrado.</p>
                        ) : (
                            <div className="space-y-4">
                                {pixels.facebook.map((fb, idx) => (
                                    <div key={fb.id || idx} className="p-4 rounded-2xl bg-[#f8fafc] dark:bg-[#111c2d] border border-[#e2e9f0] dark:border-[#1e2d42] space-y-3">
                                        <div className="flex items-center justify-between">
                                            <span className="text-xs font-bold text-blue-600">Facebook Pixel #{idx + 1}</span>
                                            <div className="flex items-center gap-3">
                                                <label className="text-xs font-semibold flex items-center gap-1.5 cursor-pointer">
                                                    <input
                                                        type="checkbox"
                                                        checked={fb.active !== false}
                                                        onChange={(e) => updateFacebook(idx, 'active', e.target.checked)}
                                                        className="w-4 h-4 rounded text-blue-600 focus:ring-blue-500"
                                                    />
                                                    Ativo
                                                </label>
                                                <button type="button" onClick={() => removeFacebook(idx)} className="text-red-500 hover:text-red-700">
                                                    <Icon name="trash-2" className="w-4 h-4" />
                                                </button>
                                            </div>
                                        </div>
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                                            <div>
                                                <label className="block text-[11px] font-bold text-[#132238] dark:text-white uppercase mb-1">ID do Pixel *</label>
                                                <input
                                                    type="text"
                                                    value={fb.pixelId}
                                                    onChange={(e) => updateFacebook(idx, 'pixelId', e.target.value)}
                                                    placeholder="1392443726166280"
                                                    className="w-full px-3 py-2 rounded-xl border border-[#e2e9f0] dark:border-[#223247] bg-white dark:bg-[#0b131f] text-xs font-mono"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-[11px] font-bold text-[#132238] dark:text-white uppercase mb-1">Código do Evento</label>
                                                <input
                                                    type="text"
                                                    value={fb.code || ''}
                                                    onChange={(e) => updateFacebook(idx, 'code', e.target.value)}
                                                    placeholder="fbq('track', 'PageView');"
                                                    className="w-full px-3 py-2 rounded-xl border border-[#e2e9f0] dark:border-[#223247] bg-white dark:bg-[#0b131f] text-xs font-mono"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-[11px] font-bold text-[#132238] dark:text-white uppercase mb-1">Token CAPI (API)</label>
                                                <input
                                                    type="text"
                                                    value={fb.token || ''}
                                                    onChange={(e) => updateFacebook(idx, 'token', e.target.value)}
                                                    placeholder="EAAWeSsA6RKs..."
                                                    className="w-full px-3 py-2 rounded-xl border border-[#e2e9f0] dark:border-[#223247] bg-white dark:bg-[#0b131f] text-xs font-mono"
                                                />
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    {/* 3. TikTok */}
                    <div className="bg-white dark:bg-[#152132] rounded-[24px] p-6 border border-[#e2e9f0] dark:border-[#1e2d42] shadow-sm space-y-4">
                        <div className="flex items-center justify-between border-b border-[#e2e9f0] dark:border-[#1e2d42] pb-3">
                            <div className="flex items-center gap-2.5">
                                <div className="w-7 h-7 rounded-lg bg-black text-white font-black text-xs flex items-center justify-center">T</div>
                                <h3 className="text-sm font-extrabold text-[#132238] dark:text-white">Pixels TikTok Ads ({pixels.tiktok.length})</h3>
                            </div>
                            <button
                                type="button"
                                onClick={addTikTok}
                                className="px-3 py-1.5 rounded-lg bg-cyan-50 dark:bg-cyan-950/40 text-cyan-600 dark:text-cyan-300 font-bold text-xs hover:bg-cyan-100 transition flex items-center gap-1.5"
                            >
                                <Icon name="plus" className="w-3.5 h-3.5" />
                                Adicionar Pixel TikTok
                            </button>
                        </div>

                        {pixels.tiktok.length === 0 ? (
                            <p className="text-xs text-[#718197] text-center py-4">Nenhum pixel do TikTok cadastrado.</p>
                        ) : (
                            <div className="space-y-4">
                                {pixels.tiktok.map((tt, idx) => (
                                    <div key={tt.id || idx} className="p-4 rounded-2xl bg-[#f8fafc] dark:bg-[#111c2d] border border-[#e2e9f0] dark:border-[#1e2d42] space-y-3">
                                        <div className="flex items-center justify-between">
                                            <span className="text-xs font-bold text-cyan-600">TikTok Pixel #{idx + 1}</span>
                                            <div className="flex items-center gap-3">
                                                <label className="text-xs font-semibold flex items-center gap-1.5 cursor-pointer">
                                                    <input
                                                        type="checkbox"
                                                        checked={tt.active !== false}
                                                        onChange={(e) => updateTikTok(idx, 'active', e.target.checked)}
                                                        className="w-4 h-4 rounded text-cyan-600 focus:ring-cyan-500"
                                                    />
                                                    Ativo
                                                </label>
                                                <button type="button" onClick={() => removeTikTok(idx)} className="text-red-500 hover:text-red-700">
                                                    <Icon name="trash-2" className="w-4 h-4" />
                                                </button>
                                            </div>
                                        </div>
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                                            <div>
                                                <label className="block text-[11px] font-bold text-[#132238] dark:text-white uppercase mb-1">ID do Pixel *</label>
                                                <input
                                                    type="text"
                                                    value={tt.pixelId}
                                                    onChange={(e) => updateTikTok(idx, 'pixelId', e.target.value)}
                                                    placeholder="DA9IHQBC77UBPDTVJ18G"
                                                    className="w-full px-3 py-2 rounded-xl border border-[#e2e9f0] dark:border-[#223247] bg-white dark:bg-[#0b131f] text-xs font-mono"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-[11px] font-bold text-[#132238] dark:text-white uppercase mb-1">Código do Evento</label>
                                                <input
                                                    type="text"
                                                    value={tt.code || ''}
                                                    onChange={(e) => updateTikTok(idx, 'code', e.target.value)}
                                                    placeholder="ttq.track('CompletePayment');"
                                                    className="w-full px-3 py-2 rounded-xl border border-[#e2e9f0] dark:border-[#223247] bg-white dark:bg-[#0b131f] text-xs font-mono"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-[11px] font-bold text-[#132238] dark:text-white uppercase mb-1">Token de API</label>
                                                <input
                                                    type="text"
                                                    value={tt.token || ''}
                                                    onChange={(e) => updateTikTok(idx, 'token', e.target.value)}
                                                    placeholder="tt_token_..."
                                                    className="w-full px-3 py-2 rounded-xl border border-[#e2e9f0] dark:border-[#223247] bg-white dark:bg-[#0b131f] text-xs font-mono"
                                                />
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    {/* SAVE BUTTON */}
                    <div className="sticky bottom-4 z-20 p-4 rounded-2xl bg-white/90 dark:bg-[#152132]/90 backdrop-blur-md border border-[#e2e9f0] dark:border-[#1e2d42] shadow-xl flex items-center justify-between gap-4">
                        <span className="text-xs text-[#718197] dark:text-[#94a3b8]">Disparos automáticos ativos em todas as páginas.</span>
                        <button
                            type="button"
                            onClick={handleSave}
                            disabled={saving}
                            className="px-8 py-3 rounded-xl bg-[#00a86b] hover:bg-[#00915c] text-white font-bold text-xs shadow-md transition-all flex items-center gap-2 disabled:opacity-50"
                        >
                            {saving ? 'Salvando...' : 'Salvar todos os pixels'}
                        </button>
                    </div>
                </div>
            );
        }

        // --- 4. ORDERS VIEW ---
        function OrdersView() {
            const [orders, setOrders] = useState([]);
            const [metrics, setMetrics] = useState(null);
            const [filterStatus, setFilterStatus] = useState('ALL');
            const [searchQuery, setSearchQuery] = useState('');
            const [loading, setLoading] = useState(true);

            const loadData = () => {
                const token = localStorage.getItem('recupera_admin_token');
                Promise.all([
                    fetch('/api/admin/metrics', { headers: { 'Authorization': 'Bearer ' + token } }).then(r => r.json()),
                    fetch('/api/admin/orders?status=' + filterStatus + '&search=' + encodeURIComponent(searchQuery), { headers: { 'Authorization': 'Bearer ' + token } }).then(r => r.json())
                ])
                .then(([metRes, ordRes]) => {
                    if (metRes.success) setMetrics(metRes.cards);
                    if (ordRes.success) setOrders(ordRes.orders || []);
                })
                .finally(() => setLoading(false));
            };

            useEffect(() => { loadData(); }, [filterStatus]);

            const handleSearchSubmit = (e) => {
                e.preventDefault();
                loadData();
            };

            const markPaid = async (orderId) => {
                const token = localStorage.getItem('recupera_admin_token');
                await fetch('/api/admin/orders/' + orderId + '/status', {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ status: 'PAID' })
                });
                loadData();
            };

            if (loading && !metrics) {
                return (
                    <div className="py-20 flex justify-center">
                        <div className="w-8 h-8 border-4 border-[#00a86b] border-t-transparent rounded-full animate-spin"></div>
                    </div>
                );
            }

            return (
                <div className="space-y-6">
                    <div>
                        <span className="text-[10px] font-bold text-[#00a86b] uppercase tracking-wider">ACOMPANHAMENTO AO VIVO</span>
                        <h2 className="text-xl font-bold text-[#132238] dark:text-white mt-0.5">Pedidos e Vendas</h2>
                    </div>

                    {/* METRIC CARDS */}
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div className="p-4 rounded-2xl bg-white dark:bg-[#152132] border border-[#e2e9f0] dark:border-[#1e2d42]">
                            <span className="text-[11px] font-bold text-[#718197] uppercase">TOTAL DE PEDIDOS</span>
                            <div className="text-2xl font-extrabold text-[#132238] dark:text-white mt-1">{metrics?.totalOrders || 0}</div>
                        </div>
                        <div className="p-4 rounded-2xl bg-white dark:bg-[#152132] border border-[#e2e9f0] dark:border-[#1e2d42]">
                            <span className="text-[11px] font-bold text-amber-600 uppercase">AGUARDANDO PIX</span>
                            <div className="text-2xl font-extrabold text-amber-600 mt-1">{metrics?.pendingOrders || 0}</div>
                        </div>
                        <div className="p-4 rounded-2xl bg-white dark:bg-[#152132] border border-[#e2e9f0] dark:border-[#1e2d42]">
                            <span className="text-[11px] font-bold text-[#00a86b] uppercase">PAGOS</span>
                            <div className="text-2xl font-extrabold text-[#00a86b] mt-1">{metrics?.paidOrders || 0}</div>
                        </div>
                        <div className="p-4 rounded-2xl bg-white dark:bg-[#152132] border border-[#e2e9f0] dark:border-[#1e2d42]">
                            <span className="text-[11px] font-bold text-[#00a86b] uppercase">RECEITA APROVADA</span>
                            <div className="text-2xl font-extrabold text-[#00a86b] mt-1">
                                R$ {(metrics?.approvedRevenue || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
                            </div>
                        </div>
                    </div>

                    {/* FILTERS & SEARCH */}
                    <div className="flex flex-col sm:flex-row items-center justify-between gap-3 bg-white dark:bg-[#152132] p-4 rounded-2xl border border-[#e2e9f0] dark:border-[#1e2d42]">
                        <form onSubmit={handleSearchSubmit} className="w-full sm:w-auto flex-1 max-w-md relative">
                            <input
                                type="text"
                                value={searchQuery}
                                onChange={(e) => setSearchQuery(e.target.value)}
                                placeholder="Buscar por nome, CPF ou ID..."
                                className="w-full pl-9 pr-4 py-2 rounded-xl border border-[#e2e9f0] dark:border-[#223247] bg-[#f8fafc] dark:bg-[#0b131f] text-xs"
                            />
                            <Icon name="search" className="w-4 h-4 text-[#718197] absolute left-3 top-2.5" />
                        </form>

                        <div className="flex items-center gap-2 w-full sm:w-auto">
                            {['ALL', 'PENDING', 'PAID'].map(st => (
                                <button
                                    key={st}
                                    type="button"
                                    onClick={() => setFilterStatus(st)}
                                    className={"px-3 py-1.5 rounded-xl text-xs font-bold transition " + (
                                        filterStatus === st
                                            ? "bg-[#00a86b] text-white"
                                            : "bg-[#f8fafc] dark:bg-[#111c2d] text-[#718197] hover:bg-[#e2e9f0]"
                                    )}
                                >
                                    {st === 'ALL' ? 'Todos' : st === 'PENDING' ? 'Aguardando' : 'Aprovados'}
                                </button>
                            ))}
                            <button onClick={loadData} className="p-2 rounded-xl border border-[#e2e9f0] dark:border-[#223247] text-[#718197] hover:text-[#00a86b]">
                                <Icon name="refresh-cw" className="w-4 h-4" />
                            </button>
                        </div>
                    </div>

                    {/* ORDERS TABLE */}
                    <div className="bg-white dark:bg-[#152132] rounded-[24px] border border-[#e2e9f0] dark:border-[#1e2d42] overflow-hidden shadow-sm">
                        <div className="overflow-x-auto custom-scroll">
                            <table className="w-full text-left text-xs">
                                <thead className="bg-[#f8fafc] dark:bg-[#111c2d] border-b border-[#e2e9f0] dark:border-[#1e2d42] text-[#718197] uppercase text-[10px] font-bold">
                                    <tr>
                                        <th className="py-3.5 px-4">Data/Hora</th>
                                        <th className="py-3.5 px-4">Cliente</th>
                                        <th className="py-3.5 px-4">CPF / Contato</th>
                                        <th className="py-3.5 px-4">Gateway</th>
                                        <th className="py-3.5 px-4">Valor</th>
                                        <th className="py-3.5 px-4">Status</th>
                                        <th className="py-3.5 px-4 text-right">Ações</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-[#e2e9f0] dark:divide-[#1e2d42]">
                                    {orders.length === 0 ? (
                                        <tr>
                                            <td colSpan="7" className="text-center py-10 text-[#718197]">
                                                Nenhum pedido encontrado.
                                            </td>
                                        </tr>
                                    ) : (
                                        orders.map(o => (
                                            <tr key={o.id} className="hover:bg-[#f8fafc] dark:hover:bg-[#111c2d]/50 transition">
                                                <td className="py-3 px-4 font-mono text-[11px] text-[#718197]">
                                                    {new Date(o.createdAt).toLocaleString('pt-BR')}
                                                </td>
                                                <td className="py-3 px-4 font-bold text-[#132238] dark:text-white">
                                                    {o.clientName || 'Beneficiário'}
                                                </td>
                                                <td className="py-3 px-4 text-[#718197] font-mono">
                                                    {o.cpfMasked || '***.***.***-**'}
                                                </td>
                                                <td className="py-3 px-4">
                                                    <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-slate-100 dark:bg-slate-800 text-[#132238] dark:text-slate-200">
                                                        {o.gateway}
                                                    </span>
                                                </td>
                                                <td className="py-3 px-4 font-bold text-[#132238] dark:text-white">
                                                    R$ {Number(o.amount).toLocaleString('pt-BR', { minimumFractionDigits: 2 })}
                                                </td>
                                                <td className="py-3 px-4">
                                                    <span className={"px-2.5 py-1 rounded-full text-[10px] font-extrabold " + (
                                                        o.status === 'PAID'
                                                            ? "bg-emerald-100 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300"
                                                            : "bg-amber-100 dark:bg-amber-950/60 text-amber-700 dark:text-amber-300"
                                                    )}>
                                                        {o.status === 'PAID' ? 'PAGO' : 'AGUARDANDO'}
                                                    </span>
                                                </td>
                                                <td className="py-3 px-4 text-right">
                                                    {o.status !== 'PAID' && (
                                                        <button
                                                            onClick={() => markPaid(o.id)}
                                                            className="px-2.5 py-1 rounded-lg bg-[#00a86b] text-white text-[10px] font-bold hover:bg-[#00915c] transition"
                                                        >
                                                            Aprovar
                                                        </button>
                                                    )}
                                                </td>
                                            </tr>
                                        ))
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        // --- 5. RETENTION & FUNNEL VIEW ---
        function RetentionView() {
            const [retentionData, setRetentionData] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const token = localStorage.getItem('recupera_admin_token');
                fetch('/api/admin/metrics', {
                    headers: { 'Authorization': 'Bearer ' + token }
                })
                .then(r => r.json())
                .then(data => {
                    if (data.success && data.retention) {
                        setRetentionData(data.retention);
                    }
                })
                .finally(() => setLoading(false));
            }, []);

            if (loading || !retentionData) {
                return (
                    <div className="py-20 flex justify-center">
                        <div className="w-8 h-8 border-4 border-[#00a86b] border-t-transparent rounded-full animate-spin"></div>
                    </div>
                );
            }

            return (
                <div className="space-y-6">
                    <div>
                        <span className="text-[10px] font-bold text-[#00a86b] uppercase tracking-wider">MÉTRICAS DO FUNIL</span>
                        <h2 className="text-xl font-bold text-[#132238] dark:text-white mt-0.5">Retenção e Conversão</h2>
                    </div>

                    {/* HERO DONUT CARD */}
                    <div className="bg-[#132238] text-white rounded-[24px] p-6 sm:p-8 flex flex-col md:flex-row items-center justify-between gap-6 shadow-xl">
                        <div className="space-y-2 text-center md:text-left">
                            <span className="text-[11px] font-bold text-[#00a86b] uppercase tracking-wider">TAXA GLOBAL DE CONVERSÃO</span>
                            <div className="text-4xl sm:text-5xl font-black">{retentionData.overallPercentage}%</div>
                            <p className="text-xs text-[#94a3b8] max-w-sm">Percentual de visitantes da pre-lander que chegam à etapa final de quitação.</p>
                        </div>
                        <div className="w-32 h-32 relative flex items-center justify-center">
                            <svg className="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                                <path className="text-slate-800" strokeWidth="3.8" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                                <path className="text-[#00a86b]" strokeDasharray={(Number(retentionData.overallPercentage) || 0) + ", 100"} strokeWidth="3.8" strokeLinecap="round" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                            </svg>
                            <span className="absolute text-sm font-extrabold">{retentionData.overallPercentage}%</span>
                        </div>
                    </div>

                    {/* FUNNEL STAGES */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        {retentionData.funnel.map((st, i) => (
                            <div key={st.stage} className="p-6 rounded-[24px] bg-white dark:bg-[#152132] border border-[#e2e9f0] dark:border-[#1e2d42] space-y-2">
                                <div className="flex items-center justify-between">
                                    <span className="text-xs font-bold text-[#718197] uppercase">ETAPA 0{i + 1}</span>
                                    <span className="text-xs font-black text-[#00a86b]">{st.rate}</span>
                                </div>
                                <h3 className="text-base font-extrabold text-[#132238] dark:text-white">{st.stage}</h3>
                                <p className="text-xs text-[#718197] dark:text-[#94a3b8]">{st.description}</p>
                                <div className="text-2xl font-black text-[#132238] dark:text-white pt-2">{st.sessions}</div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // Render React Application
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
