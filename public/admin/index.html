        // --- 4. ORDERS VIEW ---
        function OrdersView() {
            const [orders, setOrders] = useState([]);
            const [metrics, setMetrics] = useState(null);
            const [loading, setLoading] = useState(true);
            const [searchQuery, setSearchQuery] = useState('');
            const [statusFilter, setStatusFilter] = useState('ALL');
            const [selectedOrder, setSelectedOrder] = useState(null);
            const [updatingStatus, setUpdatingStatus] = useState(false);

            const loadOrdersAndMetrics = () => {
                setLoading(true);
                const token = localStorage.getItem('recupera_admin_token');
                
                Promise.all([
                    fetch(`/api/admin/orders?status=${statusFilter}&search=${encodeURIComponent(searchQuery)}`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    }).then(r => r.json()),
                    fetch('/api/admin/metrics', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    }).then(r => r.json())
                ])
                .then(([ordersData, metricsData]) => {
                    if (ordersData.success) setOrders(ordersData.orders);
                    if (metricsData.success) setMetrics(metricsData.cards);
                })
                .finally(() => setLoading(false));
            };

            useEffect(() => {
                loadOrdersAndMetrics();
            }, [statusFilter]);

            const handleSearchSubmit = (e) => {
                e.preventDefault();
                loadOrdersAndMetrics();
            };

            const handleMarkAsPaid = async (orderId) => {
                setUpdatingStatus(true);
                const token = localStorage.getItem('recupera_admin_token');
                try {
                    const res = await fetch(`/api/admin/orders/${orderId}/status`, {
                        method: 'PATCH',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ status: 'PAID' })
                    });
                    const data = await res.json();
                    if (data.success) {
                        if (selectedOrder) setSelectedOrder({ ...selectedOrder, status: 'PAID', paidAt: new Date().toISOString() });
                        loadOrdersAndMetrics();
                    }
                } catch(e) {
                    alert('Erro ao atualizar status.');
                } finally {
                    setUpdatingStatus(false);
                }
            };

            return (
                <div className="space-y-6">
                    {/* HEADER */}
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-2">
                        <div>
                            <span className="text-[11px] font-extrabold uppercase tracking-widest text-textSec">OPERAÇÃO AO VIVO</span>
                            <h2 className="text-xl sm:text-2xl font-extrabold text-navyMain tracking-tight">Pedidos</h2>
                            <p className="text-xs sm:text-sm text-textSec mt-0.5">Pedidos persistidos dos gateways ativos com atualização automática.</p>
                        </div>
                        <button
                            type="button"
                            onClick={loadOrdersAndMetrics}
                            className="px-4 py-2 rounded-xl border border-borderCol bg-white hover:bg-bgMain text-navyMain font-bold text-xs shadow-sm transition-all flex items-center gap-2 self-start sm:self-auto"
                        >
                            <Icon name="refresh-cw" className={`w-3.5 h-3.5 ${loading ? 'animate-spin-fast' : ''}`} />
                            <span>Atualizar</span>
                        </button>
                    </div>

                    {/* METRIC CARDS */}
                    {metrics && (
                        <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                            <div className="p-4 sm:p-5 rounded-card bg-white border border-borderCol shadow-card">
                                <span className="text-xs font-bold text-textSec uppercase">Pedidos totais</span>
                                <div className="text-xl sm:text-2xl font-black text-navyMain mt-1">{metrics.totalOrders}</div>
                            </div>
                            <div className="p-4 sm:p-5 rounded-card bg-white border border-borderCol shadow-card">
                                <span className="text-xs font-bold text-amberWarn uppercase">Aguardando PIX</span>
                                <div className="text-xl sm:text-2xl font-black text-amberWarn mt-1">{metrics.pendingOrders}</div>
                            </div>
                            <div className="p-4 sm:p-5 rounded-card bg-white border border-borderCol shadow-card">
                                <span className="text-xs font-bold text-accentGreen uppercase">Pagamentos aprovados</span>
                                <div className="text-xl sm:text-2xl font-black text-accentGreen mt-1">{metrics.paidOrders}</div>
                            </div>
                            <div className="p-4 sm:p-5 rounded-card bg-white border border-borderCol shadow-card">
                                <span className="text-xs font-bold text-navyMain uppercase">Receita aprovada</span>
                                <div className="text-xl sm:text-2xl font-black text-navyMain mt-1">R$ {Number(metrics.approvedRevenue || 0).toFixed(2)}</div>
                            </div>
                        </div>
                    )}

                    {/* FILTERS & SEARCH */}
                    <div className="bg-white rounded-card border border-borderCol p-4 shadow-card flex flex-col sm:flex-row items-center justify-between gap-3">
                        <form onSubmit={handleSearchSubmit} className="relative w-full sm:w-80">
                            <Icon name="search" className="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-textSec" />
                            <input
                                type="text"
                                value={searchQuery}
                                onChange={(e) => setSearchQuery(e.target.value)}
                                placeholder="Buscar por cliente, e-mail ou ID..."
                                className="w-full pl-9 pr-4 py-2 rounded-xl border border-borderCol text-xs text-navyMain bg-bgMain"
                            />
                        </form>

                        <div className="flex items-center gap-2 w-full sm:w-auto">
                            <span className="text-xs font-bold text-textSec whitespace-nowrap">Status:</span>
                            <select
                                value={statusFilter}
                                onChange={(e) => setStatusFilter(e.target.value)}
                                className="w-full sm:w-auto text-xs font-bold px-3 py-2 rounded-xl border border-borderCol bg-white text-navyMain"
                            >
                                <option value="ALL">Todos os status</option>
                                <option value="PENDING">Aguardando (Pendente)</option>
                                <option value="PAID">Pago (Aprovado)</option>
                                <option value="FAILED">Falhou</option>
                                <option value="CANCELED">Cancelado</option>
                                <option value="EXPIRED">Expirado</option>
                            </select>
                        </div>
                    </div>

                    {/* ORDERS TABLE */}
                    <div className="bg-white rounded-card border border-borderCol shadow-card overflow-hidden">
                        <div className="overflow-x-auto custom-scroll">
                            <table className="w-full text-left border-collapse text-xs">
                                <thead>
                                    <tr className="bg-bgMain/70 border-b border-borderCol text-textSec font-bold uppercase tracking-wider">
                                        <th className="py-3.5 px-4">Cliente</th>
                                        <th className="py-3.5 px-4">E-mail</th>
                                        <th className="py-3.5 px-4">Gateway</th>
                                        <th className="py-3.5 px-4">Valor</th>
                                        <th className="py-3.5 px-4">Status</th>
                                        <th className="py-3.5 px-4">Data</th>
                                        <th className="py-3.5 px-4">ID Transação</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-borderCol">
                                    {orders.map(order => {
                                        const isPaid = order.status === 'PAID' || order.status === 'APPROVED';
                                        const isPending = order.status === 'PENDING';
                                        const isFail = !isPaid && !isPending;

                                        return (
                                            <tr
                                                key={order.id}
                                                onClick={() => setSelectedOrder(order)}
                                                className="hover:bg-bgMain/50 cursor-pointer transition-colors"
                                            >
                                                <td className="py-3.5 px-4 font-bold text-navyMain whitespace-nowrap">
                                                    {order.clientName}
                                                </td>
                                                <td className="py-3.5 px-4 text-textSec whitespace-nowrap">
                                                    {order.email}
                                                </td>
                                                <td className="py-3.5 px-4 font-semibold text-navySec whitespace-nowrap">
                                                    {order.gateway}
                                                </td>
                                                <td className="py-3.5 px-4 font-extrabold text-navyMain whitespace-nowrap">
                                                    R$ {Number(order.amount).toFixed(2)}
                                                </td>
                                                <td className="py-3.5 px-4 whitespace-nowrap">
                                                    <span className={`text-[10px] font-extrabold px-2.5 py-1 rounded-full uppercase ${
                                                        isPaid
                                                            ? 'bg-greenSoft text-accentGreen border border-accentGreen/20'
                                                            : isPending
                                                                ? 'bg-amberSoft text-amberWarn border border-amberWarn/20'
                                                                : 'bg-redSoft text-redFail border border-redFail/20'
                                                    }`}>
                                                        {isPaid ? 'Pago' : isPending ? 'Pendente' : order.status}
                                                    </span>
                                                </td>
                                                <td className="py-3.5 px-4 text-textSec whitespace-nowrap">
                                                    {new Date(order.createdAt).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' })}
                                                </td>
                                                <td className="py-3.5 px-4 font-mono text-[11px] text-textSec whitespace-nowrap">
                                                    {order.transactionId || order.id}
                                                </td>
                                            </tr>
                                        );
                                    })}

                                    {orders.length === 0 && (
                                        <tr>
                                            <td colSpan="7" className="py-12 text-center text-textSec font-semibold">
                                                Nenhum pedido encontrado com os filtros aplicados.
                                            </td>
                                        </tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {/* ORDER DETAIL DRAWER */}
                    {selectedOrder && (
                        <div className="fixed inset-0 z-50 flex justify-end">
                            <div className="fixed inset-0 bg-navyMain/40 backdrop-blur-sm" onClick={() => setSelectedOrder(null)}></div>
                            <div className="relative w-full max-w-[480px] bg-white h-full shadow-drawer z-10 flex flex-col justify-between p-6 sm:p-7 overflow-y-auto custom-scroll">
                                <div className="space-y-6">
                                    <div className="flex items-center justify-between pb-4 border-b border-borderCol">
                                        <div>
                                            <span className="text-[10px] font-extrabold uppercase tracking-widest text-textSec">DETALHES DO PEDIDO</span>
                                            <h3 className="text-lg font-black text-navyMain font-mono">{selectedOrder.id}</h3>
                                        </div>
                                        <button
                                            onClick={() => setSelectedOrder(null)}
                                            className="p-1.5 text-textSec hover:text-navyMain rounded-lg"
                                            aria-label="Fechar detalhes"
                                        >
                                            <Icon name="x" className="w-5 h-5" />
                                        </button>
                                    </div>

                                    {/* STATUS BADGE */}
                                    <div className="p-4 rounded-xl bg-bgMain border border-borderCol flex items-center justify-between">
                                        <div>
                                            <span className="text-xs text-textSec block">Valor total</span>
                                            <span className="text-2xl font-black text-navyMain">R$ {Number(selectedOrder.amount).toFixed(2)}</span>
                                        </div>
                                        <span className={`text-xs font-black px-3 py-1 rounded-full uppercase ${
                                            selectedOrder.status === 'PAID'
                                                ? 'bg-greenSoft text-accentGreen'
                                                : selectedOrder.status === 'PENDING'
                                                    ? 'bg-amberSoft text-amberWarn'
                                                    : 'bg-redSoft text-redFail'
                                        }`}>
                                            {selectedOrder.status === 'PAID' ? 'Pago' : selectedOrder.status === 'PENDING' ? 'Pendente' : selectedOrder.status}
                                        </span>
                                    </div>

                                    {/* CLIENT DATA */}
                                    <div className="space-y-3">
                                        <h4 className="text-xs font-bold text-navySec uppercase tracking-wider">Dados do Cliente</h4>
                                        <div className="space-y-2 text-xs">
                                            <div className="flex justify-between py-1 border-b border-borderCol">
                                                <span className="text-textSec">Nome:</span>
                                                <span className="font-bold text-navyMain">{selectedOrder.clientName}</span>
                                            </div>
                                            <div className="flex justify-between py-1 border-b border-borderCol">
                                                <span className="text-textSec">E-mail:</span>
                                                <span className="font-bold text-navyMain">{selectedOrder.email}</span>
                                            </div>
                                            <div className="flex justify-between py-1 border-b border-borderCol">
                                                <span className="text-textSec">CPF (Mascarado):</span>
                                                <span className="font-mono font-bold text-navyMain">{selectedOrder.cpfMasked || '080.***.***-88'}</span>
                                            </div>
                                            <div className="flex justify-between py-1 border-b border-borderCol">
                                                <span className="text-textSec">Telefone (Mascarado):</span>
                                                <span className="font-mono font-bold text-navyMain">{selectedOrder.phoneMasked || '(11) 9****-****'}</span>
                                            </div>
                                        </div>
                                    </div>

                                    {/* TRANSACTION DETAILS */}
                                    <div className="space-y-3">
                                        <h4 className="text-xs font-bold text-navySec uppercase tracking-wider">Dados da Cobrança PIX</h4>
                                        <div className="space-y-2 text-xs">
                                            <div className="flex justify-between py-1 border-b border-borderCol">
                                                <span className="text-textSec">Gateway:</span>
                                                <span className="font-bold text-navyMain">{selectedOrder.gateway}</span>
                                            </div>
                                            <div className="flex justify-between py-1 border-b border-borderCol">
                                                <span className="text-textSec">ID Transação:</span>
                                                <span className="font-mono text-[11px] font-bold text-navyMain">{selectedOrder.transactionId}</span>
                                            </div>
                                            <div className="flex justify-between py-1 border-b border-borderCol">
                                                <span className="text-textSec">Item:</span>
                                                <span className="font-medium text-navyMain text-right max-w-[240px]">{selectedOrder.itemTitle}</span>
                                            </div>
                                            <div className="flex justify-between py-1 border-b border-borderCol">
                                                <span className="text-textSec">Data de Criação:</span>
                                                <span className="font-medium text-navyMain">{new Date(selectedOrder.createdAt).toLocaleString('pt-BR')}</span>
                                            </div>
                                            {selectedOrder.paidAt && (
                                                <div className="flex justify-between py-1 border-b border-borderCol">
                                                    <span className="text-textSec">Data de Aprovação:</span>
                                                    <span className="font-bold text-accentGreen">{new Date(selectedOrder.paidAt).toLocaleString('pt-BR')}</span>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>

                                <div className="pt-6 border-t border-borderCol space-y-2">
                                    {selectedOrder.status !== 'PAID' && (
                                        <button
                                            type="button"
                                            onClick={() => handleMarkAsPaid(selectedOrder.id)}
                                            disabled={updatingStatus}
                                            className="w-full py-3 rounded-xl bg-accentGreen hover:bg-[#099268] text-white font-bold text-xs shadow-md transition-all flex items-center justify-center gap-2"
                                        >
                                            <Icon name="check" className="w-4 h-4" />
                                            <span>{updatingStatus ? 'Atualizando...' : 'Confirmar Pagamento Manualmente'}</span>
                                        </button>
                                    )}

                                    <button
                                        type="button"
                                        onClick={() => setSelectedOrder(null)}
                                        className="w-full py-2.5 rounded-xl border border-borderCol bg-white hover:bg-bgMain text-navyMain font-bold text-xs transition-all"
                                    >
                                        Fechar
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // --- 5. RETENTION VIEW ---
        function RetentionView() {
            const [data, setData] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const token = localStorage.getItem('recupera_admin_token');
                fetch('/api/admin/metrics', {
                    headers: { 'Authorization': `Bearer ${token}` }
                })
                .then(r => r.json())
                .then(res => {
                    if (res.success && res.retention) {
                        setData(res.retention);
                    }
                })
                .finally(() => setLoading(false));
            }, []);

            if (loading || !data) {
                return (
                    <div className="py-20 flex justify-center">
                        <div className="w-8 h-8 border-4 border-accentGreen/20 border-t-accentGreen rounded-full animate-spin-fast"></div>
                    </div>
                );
            }

            return (
                <div className="space-y-6">
                    {/* HEADER */}
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-2">
                        <div>
                            <span className="text-[11px] font-extrabold uppercase tracking-widest text-textSec">INDICADORES DE CONVERSÃO</span>
                            <h2 className="text-xl sm:text-2xl font-extrabold text-navyMain tracking-tight">Retenção e Funil</h2>
                            <p className="text-xs sm:text-sm text-textSec mt-0.5">Acompanhamento contínuo de conversão e sessões únicas entre etapas.</p>
                        </div>
                        <div className="px-3 py-1.5 rounded-full bg-blueSoft text-blueInfo text-xs font-bold border border-blueInfo/20 self-start sm:self-auto">
                            {data.period || 'Últimos 30 dias'}
                        </div>
                    </div>

                    {/* HERO RETENTION CARD */}
                    <div className="bg-navyMain text-white rounded-card p-6 sm:p-8 shadow-soft flex flex-col md:flex-row items-start md:items-center justify-between gap-6">
                        <div className="space-y-2">
                            <span className="text-xs font-bold text-accentGreen uppercase tracking-widest">RETENÇÃO GERAL DA OPERAÇÃO</span>
                            <div className="flex items-baseline gap-3">
                                <span className="text-4xl sm:text-5xl font-black tracking-tight">{data.overallPercentage}%</span>
                                <span className="text-xs text-slate-300 font-medium">taxa média de passagem completa pelo funil</span>
                            </div>
                            <p className="text-xs text-slate-400 max-w-[540px] pt-1">
                                A retenção é calculada a partir de sessões anônimas únicas registradas nas etapas do funil de atendimento, sem depender apenas dos pedidos PIX emitidos.
                            </p>
                        </div>

                        <div className="grid grid-cols-2 gap-4 w-full md:w-auto border-t md:border-t-0 md:border-l border-slate-700 pt-4 md:pt-0 md:pl-8">
                            <div>
                                <span className="text-[11px] font-semibold text-slate-400 block">Clientes Recorrentes</span>
                                <span className="text-xl font-bold text-white mt-0.5 block">{data.recurrentClients}</span>
                            </div>
                            <div>
                                <span className="text-[11px] font-semibold text-slate-400 block">Taxa de Repetição</span>
                                <span className="text-xl font-bold text-accentGreen mt-0.5 block">{data.repetitionRate}</span>
                            </div>
                        </div>
                    </div>

                    {/* 3 FUNNEL CARDS */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                        {data.funnel.map((stage, idx) => (
                            <div key={stage.stage} className="bg-white rounded-card border border-borderCol p-5 sm:p-6 shadow-card flex flex-col justify-between space-y-4">
                                <div>
                                    <div className="flex items-center justify-between mb-2">
                                        <span className="text-xs font-bold text-textSec uppercase tracking-wider">
                                            Etapa {idx + 1} · {stage.stage}
                                        </span>
                                        <span className="text-xs font-black text-navyMain bg-bgMain px-2.5 py-1 rounded-full border border-borderCol">
                                            {stage.rate}
                                        </span>
                                    </div>
                                    <h4 className="text-2xl font-black text-navyMain">{stage.sessions.toLocaleString()} <span className="text-xs font-medium text-textSec">sessões</span></h4>
                                    <p className="text-xs text-textSec mt-1.5">{stage.description}</p>
                                </div>

                                <div className="space-y-1.5 pt-2">
                                    <div className="flex justify-between text-[11px] font-semibold text-textSec">
                                        <span>Conversão relativa</span>
                                        <span className="font-bold text-navyMain">{stage.progress}%</span>
                                    </div>
                                    <div className="w-full h-2.5 bg-bgMain rounded-full overflow-hidden border border-borderCol">
                                        <div 
                                            className="h-full rounded-full transition-all duration-500" 
                                            style={{ width: `${stage.progress}%`, backgroundColor: stage.color }}
                                        ></div>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // Mount React application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
